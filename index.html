<!DOCTYPE html>
<html lang="en" data-theme="hero">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Boardwalk Comic Universe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .intro-root {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .intro-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #1b2140 0%, #05060a 60%, #000 100%);
      z-index: 0;
    }

    .page-stack {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 2600px;
      z-index: 1;
    }

    .page {
      position: absolute;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      border-radius: 0;
      box-shadow: 0 0 120px rgba(0,0,0,0.9);
      transform-origin: left center;
      opacity: 0;
      transform: translateX(-20%) rotateY(50deg) scale(1.1);
      filter: brightness(0.6) contrast(1.1);
      mix-blend-mode: lighten;
    }

    .page--active {
      animation: pageFlip 0.7s ease-out forwards;
    }

    .page--burn {
      animation: pageBurn 0.9s ease-out forwards;
    }

    @keyframes pageFlip {
      0% {
        opacity: 0;
        transform: translateX(-30%) rotateY(70deg) scale(1.15);
        filter: brightness(0.3);
      }
      40% {
        opacity: 1;
        transform: translateX(0%) rotateY(0deg) scale(1);
        filter: brightness(1);
      }
      100% {
        opacity: 1;
        transform: translateX(3%) rotateY(-8deg) scale(1.02);
        filter: brightness(1.15);
      }
    }

    @keyframes pageBurn {
      0% {
        opacity: 1;
        filter: brightness(1.2) contrast(1.1) drop-shadow(0 0 40px rgba(255,140,0,0.7));
        clip-path: inset(0% 0% 0% 0%);
      }
      40% {
        filter: brightness(1.4) contrast(1.3) drop-shadow(0 0 60px rgba(255,80,0,1));
        clip-path: inset(8% 6% 10% 6%);
      }
      80% {
        filter: brightness(0.8) contrast(1.6) drop-shadow(0 0 80px rgba(255,40,0,1));
        clip-path: inset(25% 20% 30% 22%);
      }
      100% {
        opacity: 0;
        filter: brightness(0.2) contrast(2) drop-shadow(0 0 100px rgba(0,0,0,1));
        clip-path: inset(50% 50% 50% 50%);
      }
    }

    .intro-title-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 3;
      text-align: center;
    }

    .intro-kicker {
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: #9aa4ff;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fadeUp 1.2s ease-out 0.4s forwards;
    }

    .intro-title {
      font-size: clamp(2.8rem, 6vw, 4.2rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 40px rgba(0,0,0,0.9);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.2s ease-out 0.8s forwards;
    }

    .intro-sub {
      margin-top: 0.75rem;
      font-size: 1rem;
      color: #cfd3ff;
      max-width: 480px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.2s ease-out 1.2s forwards;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro-cta {
      margin-top: 2.4rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.2s ease-out 1.6s forwards;
    }

    .intro-btn {
      padding: 0.9rem 2rem;
      border-radius: 999px;
      border: 1px solid #9aa4ff;
      background: rgba(5,6,20,0.9);
      color: #e5e7ff;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
      pointer-events: auto;
    }

    .intro-btn:hover {
      background: #9aa4ff;
      color: #05060a;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .intro-btn--ghost {
      border-color: #ff6b6b;
      color: #ffb3b3;
    }

    .intro-btn--ghost:hover {
      background: #ff6b6b;
      color: #05060a;
    }

    .intro-noise {
      position: absolute;
      inset: -40px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='noStitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
      opacity: 0.7;
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>

<body>
  <div class="intro-root">
    <div class="intro-bg"></div>

    <div class="page-stack" id="pageStack">
      <div class="page" style="background-image:url('assets/pages/page-1.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-2.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-3.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-4.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-5.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-6.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-7.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-8.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-9.jpg')"></div>
      <div class="page" style="background-image:url('assets/pages/page-10.jpg')"></div>
    </div>

    <div class="intro-title-wrap">
      <div class="intro-kicker">WELCOME TO</div>
      <div class="intro-title">BOARDWALK COMIC UNIVERSE</div>
      <div class="intro-sub">
        A cinematic gateway into your world — where every frame hits like a panel.
      </div>
      <div class="intro-cta">
        <a href="library.html" class="intro-btn">Enter Library</a>
        <a href="audio.html" class="intro-btn intro-btn--ghost">Audio Universe</a>
      </div>
    </div>

    <div class="intro-noise"></div>
  </div>

  <script>
    const pages = Array.from(document.querySelectorAll(".page"));
    let index = 0;

    function showNextPage() {
      const prev = pages[index - 1];
      const current = pages[index];

      if (prev) {
        prev.classList.remove("page--active");
        prev.classList.add("page--burn");
      }

      if (current) {
        current.classList.remove("page--burn");
        current.classList.add("page--active");
      }

      index++;

      if (index <= pages.length) {
        setTimeout(showNextPage, 260);
      } else {
        setTimeout(() => {
          pages.forEach(p => p.classList.remove("page--burn"));
        }, 1200);
      }
    }

    setTimeout(showNextPage, 400);
  </script>
</body>
</html>
