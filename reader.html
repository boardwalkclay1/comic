<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk PDF Comic Reader</title>

  <style>
    body {
      margin: 0;
      background: #05060a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header, footer {
      padding: 12px 16px;
      background: #0b0d16;
      border-bottom: 1px solid #222838;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    footer {
      border-top: 1px solid #222838;
      border-bottom: none;
    }

    #viewer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    #flipWrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 2000px;
    }

    .pageCanvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: translateX(-50%) rotateY(-180deg);
      box-shadow: -20px 0 40px rgba(0,0,0,0.6);
    }

    button {
      padding: 8px 16px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid #343c66;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    button:hover {
      background: #27305a;
    }

    .page-info {
      font-size: 12px;
      color: #9aa4ff;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

<header>
  <div>Boardwalk Comic Reader</div>
  <div id="status">Loading…</div>
</header>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<footer>
  <button id="prevBtn">Prev</button>
  <div class="page-info" id="pageInfo">Page 0 / 0</div>
  <button id="nextBtn">Next</button>
</footer>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

  // Get ?id=
  let fileName = new URLSearchParams(window.location.search).get("id");

  if (!fileName) {
    document.getElementById("status").textContent = "No PDF specified.";
    throw new Error("Missing ?id= parameter");
  }

  // Auto-add .pdf
  if (!fileName.toLowerCase().endsWith(".pdf")) {
    fileName = fileName + ".pdf";
  }

  // Your real path
  const PDF_URL = `https://boardwalkclay1.github.io/comic/assets/books/${fileName}`;

  const pageA = document.getElementById("pageA");
  const pageB = document.getElementById("pageB");
  const ctxA = pageA.getContext("2d");
  const ctxB = pageB.getContext("2d");

  const status = document.getElementById("status");
  const pageInfo = document.getElementById("pageInfo");

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let isRendering = false;
  let showingA = true;

  function setStatus(msg) {
    status.textContent = msg;
  }

  async function renderPageToCanvas(pageNum, canvas, ctx) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;
  }

  async function flipToPage(num) {
    if (isRendering) return;
    isRendering = true;

    const front = showingA ? pageA : pageB;
    const back = showingA ? pageB : pageA;
    const backCtx = showingA ? ctxB : ctxA;

    await renderPageToCanvas(num, back, backCtx);

    // Reset transforms
    front.style.transform = "translateX(-50%) rotateY(0deg)";
    back.style.transform = "translateX(-50%) rotateY(180deg)";

    // Trigger flip
    requestAnimationFrame(() => {
      back.classList.add("flip");
    });

    setTimeout(() => {
      back.classList.remove("flip");
      showingA = !showingA;
      currentPage = num;
      pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
      isRendering = false;
    }, 600);
  }

  async function loadPdf() {
    try {
      setStatus(`Loading ${fileName}…`);
      const loadingTask = pdfjsLib.getDocument(PDF_URL);
      pdfDoc = await loadingTask.promise;

      totalPages = pdfDoc.numPages;

      // Render first page to pageA
      await renderPageToCanvas(1, pageA, ctxA);
      pageInfo.textContent = `Page 1 / ${totalPages}`;
      setStatus("Ready");
    } catch (err) {
      console.error(err);
      setStatus("Failed to load PDF");
    }
  }

  prevBtn.onclick = () => {
    if (currentPage <= 1) return;
    flipToPage(currentPage - 1);
  };

  nextBtn.onclick = () => {
    if (currentPage >= totalPages) return;
    flipToPage(currentPage + 1);
  };

  loadPdf();
</script>

</body>
</html>
