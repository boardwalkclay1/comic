<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk Comic Reader</title>

  <style>
    :root {
      --theme-bg: #05060a;
      --theme-accent: #343c66;
    }

    body {
      margin: 0;
      background: var(--theme-bg);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-x: hidden;
    }

    header, footer {
      padding: 12px 16px;
      background: #0b0d16;
      border-bottom: 1px solid var(--theme-accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    footer {
      border-top: 1px solid var(--theme-accent);
      border-bottom: none;
    }

    #viewer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
      height: calc(100vh - 140px);
      position: relative;
    }

    #flipWrapper {
      position: relative;
      display: inline-block;
      perspective: 2000px;
      height: 100%;
    }

    .pageCanvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: translateX(-50%) rotateY(-180deg);
      box-shadow: -20px 0 40px rgba(0,0,0,0.6);
    }

    button {
      padding: 8px 16px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid var(--theme-accent);
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    button:hover {
      background: var(--theme-accent);
    }

    .page-info {
      font-size: 12px;
      color: var(--theme-accent);
      text-transform: uppercase;
    }

    /* YOUTUBE SECTION */
    #ytSection {
      padding: 20px;
      background: #05060f;
      border-top: 1px solid #222;
      text-align: center;
    }

    #ytFrame {
      width: 360px;
      height: 200px;
      border-radius: 8px;
      border: 1px solid #343c66;
    }
  </style>
</head>

<body>

<header>
  <div>Boardwalk Comic Reader</div>
  <div id="status">Loading…</div>
</header>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<!-- YOUTUBE PLAYER -->
<div id="ytSection">
  <iframe 
    id="ytFrame"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"
    title="YouTube video player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

<footer>
  <button id="prevBtn">Prev</button>
  <div class="page-info" id="pageInfo">Page 0 / 0</div>
  <button id="nextBtn">Next</button>
</footer>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

  const comicThemes = {
    "gold-lake-1": "#2a4dff",
    "gold-lake-2": "#2a4dff",
    "new-civil-war-1": "#ff2a2a",
    "new-civil-war-2": "#ff2a2a",
    "new-civil-war-3": "#ff2a2a"
  };

  let fileName = new URLSearchParams(window.location.search).get("id");
  if (!fileName) throw new Error("Missing ?id=");

  if (!fileName.toLowerCase().endsWith(".pdf")) fileName += ".pdf";

  const baseName = fileName.replace(".pdf", "");
  const themeColor = comicThemes[baseName] || "#343c66";

  document.documentElement.style.setProperty("--theme-accent", themeColor);

  const PDF_URL = `https://boardwalkclay1.github.io/comic/assets/books/${fileName}`;

  const pageA = document.getElementById("pageA");
  const pageB = document.getElementById("pageB");
  const ctxA = pageA.getContext("2d");
  const ctxB = pageB.getContext("2d");

  const status = document.getElementById("status");
  const pageInfo = document.getElementById("pageInfo");

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let isRendering = false;
  let showingA = true;

  function setStatus(msg) {
    status.textContent = msg;
  }

  async function renderPageToCanvas(pageNum, canvas, ctx) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });

    const scale = (window.innerHeight - 140) / viewport.height;
    const scaledViewport = page.getViewport({ scale });

    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;

    await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
  }

  async function flipToPage(num) {
    if (isRendering) return;
    isRendering = true;

    const front = showingA ? pageA : pageB;
    const back = showingA ? pageB : pageA;
    const backCtx = showingA ? ctxB : ctxA;

    await renderPageToCanvas(num, back, backCtx);

    front.style.transform = "translateX(-50%) rotateY(0deg)";
    back.style.transform = "translateX(-50%) rotateY(180deg)";

    requestAnimationFrame(() => back.classList.add("flip"));

    setTimeout(() => {
      back.classList.remove("flip");
      showingA = !showingA;
      currentPage = num;
      pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
      isRendering = false;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 600);
  }

  async function loadPdf() {
    setStatus(`Loading ${fileName}…`);
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    totalPages = pdfDoc.numPages;

    await renderPageToCanvas(1, pageA, ctxA);
    pageInfo.textContent = `Page 1 / ${totalPages}`;
    setStatus("Ready");
  }

  document.getElementById("prevBtn").onclick = () => {
    if (currentPage > 1) flipToPage(currentPage - 1);
  };

  document.getElementById("nextBtn").onclick = () => {
    if (currentPage < totalPages) flipToPage(currentPage + 1);
  };

  loadPdf();
</script>

</body>
</html>
