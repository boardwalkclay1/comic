<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk Comic Reader</title>

  <style>
    :root {
      --theme-bg: #05060a;
      --theme-accent: #343c66;
    }

    body {
      margin: 0;
      background: var(--theme-bg);
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #viewer {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
      overflow-y: auto;
      padding-top: 40px;
      padding-bottom: 200px;
    }

    #flipWrapper {
      position: relative;
      display: inline-block;
      perspective: 2000px;
    }

    .pageCanvas {
      width: 100%;
      max-width: 900px;
      height: auto;
      transition: transform 1.4s ease, box-shadow 1.4s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: rotateY(-180deg);
      box-shadow: -40px 0 80px rgba(0,0,0,0.8);
    }

    #navButtons {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .navBtn {
      padding: 10px 20px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid var(--theme-accent);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .navBtn:hover {
      background: var(--theme-accent);
    }

    /* MUSIC SECTION */
    #musicSection {
      padding: 20px;
      background: #05060f;
      border-top: 1px solid #222;
      text-align: center;
    }

    #scPlayer {
      width: 100%;
      max-width: 900px;
      height: 300px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<div id="navButtons">
  <div class="navBtn" id="prevBtn">Prev</div>
  <div class="navBtn" id="nextBtn">Next</div>
</div>

<!-- SOUNDTRACK EMBED -->
<div id="musicSection">
  <iframe 
    id="scPlayer"
    scrolling="no"
    frameborder="no"
    allow="autoplay">
  </iframe>
</div>

<!-- LOAD JS FROM assets/js/reader.js -->
<script type="module" src="assets/js/reader.js"></script>

</body>
</html>
