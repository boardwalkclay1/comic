<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk PDF Comic Reader</title>

  <style>
    :root {
      --theme-bg: #05060a;
      --theme-accent: #343c66;
    }

    body {
      margin: 0;
      background: var(--theme-bg);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header, footer {
      padding: 12px 16px;
      background: #0b0d16;
      border-bottom: 1px solid var(--theme-accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    footer {
      border-top: 1px solid var(--theme-accent);
      border-bottom: none;
    }

    #viewer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      background: #000;
      padding: 10px 0;
    }

    #flipWrapper {
      position: relative;
      display: inline-block;
      perspective: 2000px;
    }

    .pageCanvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: translateX(-50%) rotateY(-180deg);
      box-shadow: -20px 0 40px rgba(0,0,0,0.6);
    }

    button {
      padding: 8px 16px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid var(--theme-accent);
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    button:hover {
      background: var(--theme-accent);
    }

    .page-info {
      font-size: 12px;
      color: var(--theme-accent);
      text-transform: uppercase;
    }

    /* Compact, stylish YouTube section */
    #musicPlayer {
      padding: 10px 16px 14px 16px;
      background: #05060f;
      border-top: 1px solid #222838;
    }

    #ytSearchBar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #ytSearch {
      flex: 1;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #343c66;
      background: #02030a;
      color: #e5e7ff;
      font-size: 12px;
      outline: none;
    }

    #ytSearch::placeholder {
      color: #6b72a8;
    }

    #ytBtn {
      padding: 6px 14px;
      border-radius: 999px;
      background: #1b2140;
      border: 1px solid var(--theme-accent);
      color: #e5e7ff;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #ytBtn:hover {
      background: var(--theme-accent);
    }

    #ytResults {
      margin-top: 8px;
      max-height: 140px;
      overflow-y: auto;
    }

    .yt-result {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      cursor: pointer;
      font-size: 11px;
      color: #cfd3ff;
    }

    .yt-result:hover {
      color: #ffffff;
    }

    .yt-thumb {
      width: 40px;
      height: 24px;
      object-fit: cover;
      border-radius: 4px;
    }

    #ytPlayerWrapper {
      margin-top: 10px;
      display: none;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(0,0,0,0.7);
      border: 1px solid var(--theme-accent);
      max-width: 360px;
    }

    #ytPlayer {
      width: 100%;
      height: 200px;
    }
  </style>
</head>

<body>

<header>
  <div>Boardwalk Comic Reader</div>
  <div id="status">Loading…</div>
</header>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<div id="musicPlayer">
  <div id="ytSearchBar">
    <input id="ytSearch" placeholder="Search YouTube music…" />
    <button id="ytBtn">Search</button>
  </div>
  <div id="ytResults"></div>
  <div id="ytPlayerWrapper">
    <div id="ytPlayer"></div>
  </div>
</div>

<footer>
  <button id="prevBtn">Prev</button>
  <div class="page-info" id="pageInfo">Page 0 / 0</div>
  <button id="nextBtn">Next</button>
</footer>

<script src="https://www.youtube.com/iframe_api"></script>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

  const comicThemes = {
    "gold-lake-1": "#2a4dff",
    "gold-lake-2": "#2a4dff",
    "new-civil-war-1": "#ff2a2a",
    "new-civil-war-2": "#ff2a2a",
    "new-civil-war-3": "#ff2a2a"
  };

  let fileName = new URLSearchParams(window.location.search).get("id");

  if (!fileName) {
    document.getElementById("status").textContent = "No PDF specified.";
    throw new Error("Missing ?id= parameter");
  }

  if (!fileName.toLowerCase().endsWith(".pdf")) {
    fileName = fileName + ".pdf";
  }

  const baseName = fileName.replace(".pdf", "");
  const themeColor = comicThemes[baseName] || "#343c66";

  document.documentElement.style.setProperty("--theme-accent", themeColor);
  document.documentElement.style.setProperty("--theme-bg", "#05060a");

  const PDF_URL = `https://boardwalkclay1.github.io/comic/assets/books/${fileName}`;

  const pageA = document.getElementById("pageA");
  const pageB = document.getElementById("pageB");
  const ctxA = pageA.getContext("2d");
  const ctxB = pageB.getContext("2d");

  const status = document.getElementById("status");
  const pageInfo = document.getElementById("pageInfo");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let isRendering = false;
  let showingA = true;

  function setStatus(msg) {
    status.textContent = msg;
  }

  async function renderPageToCanvas(pageNum, canvas, ctx) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;
  }

  async function flipToPage(num) {
    if (isRendering) return;
    isRendering = true;

    const front = showingA ? pageA : pageB;
    const back = showingA ? pageB : pageA;
    const backCtx = showingA ? ctxB : ctxA;

    await renderPageToCanvas(num, back, backCtx);

    front.style.transform = "translateX(-50%) rotateY(0deg)";
    back.style.transform = "translateX(-50%) rotateY(180deg)";

    requestAnimationFrame(() => {
      back.classList.add("flip");
    });

    setTimeout(() => {
      back.classList.remove("flip");
      showingA = !showingA;
      currentPage = num;
      pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
      isRendering = false;
    }, 600);
  }

  async function loadPdf() {
    try {
      setStatus(`Loading ${fileName}…`);
      const loadingTask = pdfjsLib.getDocument(PDF_URL);
      pdfDoc = await loadingTask.promise;

      totalPages = pdfDoc.numPages;

      await renderPageToCanvas(1, pageA, ctxA);
      pageInfo.textContent = `Page 1 / ${totalPages}`;
      setStatus("Ready");
    } catch (err) {
      console.error(err);
      setStatus("Failed to load PDF");
    }
  }

  prevBtn.onclick = () => {
    if (currentPage <= 1) return;
    flipToPage(currentPage - 1);
  };

  nextBtn.onclick = () => {
    if (currentPage >= totalPages) return;
    flipToPage(currentPage + 1);
  };

  loadPdf();

  // YOUTUBE
  let ytPlayer;

  window.onYouTubeIframeAPIReady = () => {
    ytPlayer = new YT.Player("ytPlayer", {
      height: "200",
      width: "360",
      videoId: "",
      playerVars: { autoplay: 1 }
    });
  };

  const ytBtn = document.getElementById("ytBtn");
  const ytSearch = document.getElementById("ytSearch");
  const ytResults = document.getElementById("ytResults");
  const ytPlayerWrapper = document.getElementById("ytPlayerWrapper");

  ytBtn.onclick = async () => {
    const q = ytSearch.value.trim();
    if (!q) return;

    // Replace YOUR_API_KEY with a valid YouTube Data API v3 key
    const apiKey = "YOUR_API_KEY";
    const url =
      `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=5&q=${encodeURIComponent(q)}&key=${apiKey}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      ytResults.innerHTML = "";

      (data.items || []).forEach(item => {
        const vid = item.id.videoId;
        const title = item.snippet.title;
        const thumb = item.snippet.thumbnails.default?.url;

        const row = document.createElement("div");
        row.className = "yt-result";

        if (thumb) {
          const img = document.createElement("img");
          img.src = thumb;
          img.className = "yt-thumb";
          row.appendChild(img);
        }

        const span = document.createElement("span");
        span.textContent = title;
        row.appendChild(span);

        row.onclick = () => {
          ytPlayerWrapper.style.display = "block";
          ytPlayer.loadVideoById(vid);
        };

        ytResults.appendChild(row);
      });
    } catch (e) {
      console.error(e);
    }
  };
</script>

</body>
</html>
