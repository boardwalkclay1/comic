<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk Comic Reader</title>

  <style>
    :root {
      --theme-bg: #05060a;
      --theme-accent: #343c66;
    }

    body {
      margin: 0;
      background: var(--theme-bg);
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* FULL SIZE COMIC */
    #viewer {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
      overflow-y: auto;
      padding-top: 40px;
      padding-bottom: 200px;
    }

    #flipWrapper {
      position: relative;
      display: inline-block;
      perspective: 2000px;
    }

    .pageCanvas {
      width: 100%;
      max-width: 900px;
      height: auto;
      transition: transform 1.4s ease, box-shadow 1.4s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: rotateY(-180deg);
      box-shadow: -40px 0 80px rgba(0,0,0,0.8);
    }

    /* FLOATING NAV BUTTONS */
    #navButtons {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .navBtn {
      padding: 10px 20px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid var(--theme-accent);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .navBtn:hover {
      background: var(--theme-accent);
    }

    /* MUSIC SECTION */
    #musicSection {
      padding: 20px;
      background: #05060f;
      border-top: 1px solid #222;
      text-align: center;
    }

    #scPlayer {
      width: 100%;
      max-width: 900px;
      height: 300px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<div id="navButtons">
  <div class="navBtn" id="prevBtn">Prev</div>
  <div class="navBtn" id="nextBtn">Next</div>
</div>

<!-- SOUNDTRACK EMBED -->
<div id="musicSection">

  <iframe 
    id="scPlayer"
    width="100%" 
    height="300" 
    scrolling="no" 
    frameborder="no" 
    allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2187301982&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
  </iframe>

  <div style="font-size: 10px; color: #cccccc; line-break: anywhere; word-break: normal; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-family: Interstate,Lucida Grande,Lucida Sans Unicode,Lucida Sans,Garuda,Verdana,Tahoma,sans-serif; font-weight: 100;">
    <a href="https://soundcloud.com/clayvonte-broach-636163207" title="Clayvonte Broach" target="_blank" style="color: #cccccc; text-decoration: none;">Clayvonte Broach</a> · 
    <a href="https://soundcloud.com/clayvonte-broach-636163207/sets/khalid" title="khalid" target="_blank" style="color: #cccccc; text-decoration: none;">khalid</a>
  </div>

</div>

<!-- FIXED: DEFER LOADING -->
<script defer type="module" src="assets/js/reader.js"></script>

</body>
</html>
