<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Comic Reader – PDF</title>
  <style>
    body {
      margin: 0;
      background: #05060a;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 10px 16px;
      background: #0b0d16;
      border-bottom: 1px solid #222838;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .title {
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 13px;
      color: #9aa4ff;
    }
    header .subtitle {
      font-size: 11px;
      color: #6f7695;
    }
    #viewerContainer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: radial-gradient(circle at top, #151a2b 0, #05060a 55%);
    }
    #canvasWrapper {
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      max-width: 100%;
      max-height: 100%;
    }
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
    footer {
      padding: 10px 16px;
      background: #0b0d16;
      border-top: 1px solid #222838;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid #343c66;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    button:hover {
      background: #27305a;
      box-shadow: 0 0 12px rgba(90,110,255,0.4);
      transform: translateY(-1px);
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    .page-info {
      font-size: 12px;
      color: #9aa4ff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status {
      font-size: 11px;
      color: #6f7695;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="title">Boardwalk Comic Reader</div>
      <div class="subtitle" id="comicName">Loaded from PDF</div>
    </div>
    <div class="status" id="statusText">Ready</div>
  </header>

  <div id="viewerContainer">
    <div id="canvasWrapper">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <footer>
    <div class="controls">
      <button id="prevBtn">Prev</button>
      <button id="nextBtn">Next</button>
    </div>
    <div class="page-info" id="pageInfo">Page 0 / 0</div>
  </footer>

  <script type="module">
    // 🔧 CHANGE THIS TO YOUR PDF PATH
    // Example: "comics/gold-lake.pdf" or "assets/comics/book1.pdf"
    const PDF_URL = "comics/your-comic.pdf";

    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");
    const statusText = document.getElementById("statusText");

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 0;
    let isRendering = false;
    let pendingPage = null;

    function setStatus(text) {
      statusText.textContent = text;
    }

    function queueRenderPage(num) {
      if (isRendering) {
        pendingPage = num;
      } else {
        renderPage(num);
      }
    }

    async function renderPage(num) {
      isRendering = true;
      setStatus("Rendering page " + num + "…");

      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: 1.5 });

      canvas.width = viewport.width;
      canvas.height = viewport.height;

      const renderContext = {
        canvasContext: ctx,
        viewport
      };

      await page.render(renderContext).promise;

      pageInfo.textContent = `Page ${num} / ${totalPages}`;
      setStatus("Ready");

      isRendering = false;

      if (pendingPage !== null) {
        const next = pendingPage;
        pendingPage = null;
        renderPage(next);
      }
    }

    async function loadPdf() {
      try {
        setStatus("Loading PDF…");
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;
        currentPage = 1;
        setStatus("PDF loaded");
        renderPage(currentPage);
      } catch (err) {
        console.error(err);
        setStatus("Failed to load PDF");
      }
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage <= 1) return;
      currentPage--;
      queueRenderPage(currentPage);
    });

    nextBtn.addEventListener("click", () => {
      if (currentPage >= totalPages) return;
      currentPage++;
      queueRenderPage(currentPage);
    });

    // Kick it off
    loadPdf();
  </script>

</body>
</html>
