<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk Comic Reader</title>

  <style>
    :root {
      --theme-bg: #05060a;
      --theme-accent: #343c66;
    }

    body {
      margin: 0;
      background: var(--theme-bg);
      color: #fff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    #viewer {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }

    #flipWrapper {
      position: relative;
      display: inline-block;
      perspective: 2000px;
      height: 100%;
    }

    .pageCanvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 100%;
      width: auto;
      transition: transform 1.4s ease, box-shadow 1.4s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: translateX(-50%) rotateY(-180deg);
      box-shadow: -40px 0 80px rgba(0,0,0,0.8);
    }

    #ytSection {
      padding: 30px;
      background: #05060f;
      border-top: 1px solid #222;
      text-align: center;
      margin-top: 40px;
    }

    #ytSearch {
      width: 90%;
      max-width: 360px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #343c66;
      background: #02030a;
      color: #e5e7ff;
      font-size: 14px;
      outline: none;
    }

    #ytResults {
      margin-top: 12px;
      max-height: 220px;
      overflow-y: auto;
      font-size: 14px;
    }

    .yt-row {
      padding: 8px 0;
      cursor: pointer;
      color: #cfd3ff;
    }

    .yt-row:hover {
      color: #ffffff;
    }

    #ytFrame {
      width: 360px;
      height: 220px;
      border-radius: 8px;
      border: 1px solid #343c66;
      margin-top: 12px;
    }

    #navButtons {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 50;
    }

    .navBtn {
      padding: 10px 20px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid var(--theme-accent);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .navBtn:hover {
      background: var(--theme-accent);
    }
  </style>
</head>

<body>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<div id="navButtons">
  <div class="navBtn" id="prevBtn">Prev</div>
  <div class="navBtn" id="nextBtn">Next</div>
</div>

<div id="ytSection">
  <input id="ytSearch" placeholder="Search YouTube…">
  <div id="ytResults"></div>

  <iframe 
    id="ytFrame"
    src=""
    title="YouTube player"
    frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>
</div>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

  const comicThemes = {
    "gold-lake-1": "#2a4dff",
    "gold-lake-2": "#2a4dff",
    "new-civil-war-1": "#ff2a2a",
    "new-civil-war-2": "#ff2a2a",
    "new-civil-war-3": "#ff2a2a"
  };

  let fileName = new URLSearchParams(window.location.search).get("id");
  if (!fileName) throw new Error("Missing ?id=");
  if (!fileName.toLowerCase().endsWith(".pdf")) fileName += ".pdf";

  const baseName = fileName.replace(".pdf", "");
  const themeColor = comicThemes[baseName] || "#343c66";
  document.documentElement.style.setProperty("--theme-accent", themeColor);

  const PDF_URL = `https://boardwalkclay1.github.io/comic/assets/books/${fileName}`;

  const pageA = document.getElementById("pageA");
  const pageB = document.getElementById("pageB");
  const ctxA = pageA.getContext("2d");
  const ctxB = pageB.getContext("2d");

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let isRendering = false;
  let showingA = true;

  async function renderPageToCanvas(pageNum, canvas, ctx) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 2.2 });

    const scale = window.innerHeight / viewport.height;
    const scaledViewport = page.getViewport({ scale });

    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;

    await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
  }

  async function flipToPage(num) {
    if (isRendering) return;
    isRendering = true;

    const front = showingA ? pageA : pageB;
    const back = showingA ? pageB : pageA;
    const backCtx = showingA ? ctxB : ctxA;

    await renderPageToCanvas(num, back, backCtx);

    front.style.transform = "translateX(-50%) rotateY(0deg)";
    back.style.transform = "translateX(-50%) rotateY(180deg)";

    requestAnimationFrame(() => back.classList.add("flip"));

    setTimeout(() => {
      back.classList.remove("flip");
      showingA = !showingA;
      currentPage = num;
      isRendering = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, 1400);
  }

  async function loadPdf() {
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    totalPages = pdfDoc.numPages;

    await renderPageToCanvas(1, pageA, ctxA);
  }

  document.getElementById("prevBtn").onclick = () => {
    if (currentPage > 1) flipToPage(currentPage - 1);
  };

  document.getElementById("nextBtn").onclick = () => {
    if (currentPage < totalPages) flipToPage(currentPage + 1);
  };

  loadPdf();

  const ytSearch = document.getElementById("ytSearch");
  const ytResults = document.getElementById("ytResults");
  const ytFrame = document.getElementById("ytFrame");

  ytSearch.addEventListener("input", () => {
    const q = ytSearch.value.trim();
    if (!q) return;

    ytResults.innerHTML = `
      <div class="yt-row" onclick="ytFrame.src='https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}'">
        Play search results for: ${q}
      </div>
    `;
  });
</script>

</body>
</html>
