<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk PDF Comic Reader</title>
  <style>
    body {
      margin: 0;
      background: #05060a;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header, footer {
      padding: 12px 16px;
      background: #0b0d16;
      border-bottom: 1px solid #222838;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer {
      border-top: 1px solid #222838;
      border-bottom: none;
    }
    #viewer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: #000;
    }
    canvas {
      max-width: 100%;
      height: auto;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
    }
    button {
      padding: 8px 16px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid #343c66;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    button:hover {
      background: #27305a;
    }
    .page-info {
      font-size: 12px;
      color: #9aa4ff;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<header>
  <div>Boardwalk Comic Reader</div>
  <div id="status">Loading…</div>
</header>

<div id="viewer">
  <canvas id="pdfCanvas"></canvas>
</div>

<footer>
  <button id="prevBtn">Prev</button>
  <div class="page-info" id="pageInfo">Page 0 / 0</div>
  <button id="nextBtn">Next</button>
</footer>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

  // 🔥🔥🔥 THIS IS THE FIX 🔥🔥🔥
  // We build an ABSOLUTE URL to your PDF
  const fileName = new URLSearchParams(window.location.search).get("id");

  if (!fileName) {
    document.getElementById("status").textContent = "No PDF specified.";
    throw new Error("Missing ?id= parameter");
  }

  const PDF_URL = `https://boardwalkclay1.github.io/comic/${fileName}`;

  const canvas = document.getElementById("pdfCanvas");
  const ctx = canvas.getContext("2d");
  const status = document.getElementById("status");
  const pageInfo = document.getElementById("pageInfo");

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let isRendering = false;
  let pendingPage = null;

  function setStatus(msg) {
    status.textContent = msg;
  }

  function queueRenderPage(num) {
    if (isRendering) {
      pendingPage = num;
    } else {
      renderPage(num);
    }
  }

  async function renderPage(num) {
    isRendering = true;
    setStatus("Rendering page " + num + "…");

    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: 1.5 });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    pageInfo.textContent = `Page ${num} / ${totalPages}`;
    setStatus("Ready");

    isRendering = false;

    if (pendingPage !== null) {
      const next = pendingPage;
      pendingPage = null;
      renderPage(next);
    }
  }

  async function loadPdf() {
    try {
      setStatus("Loading PDF…");
      const loadingTask = pdfjsLib.getDocument(PDF_URL);
      pdfDoc = await loadingTask.promise;

      totalPages = pdfDoc.numPages;
      currentPage = 1;

      renderPage(currentPage);
    } catch (err) {
      console.error(err);
      setStatus("Failed to load PDF");
    }
  }

  document.getElementById("prevBtn").onclick = () => {
    if (currentPage <= 1) return;
    currentPage--;
    queueRenderPage(currentPage);
  };

  document.getElementById("nextBtn").onclick = () => {
    if (currentPage >= totalPages) return;
    currentPage++;
    queueRenderPage(currentPage);
  };

  loadPdf();
</script>

</body>
</html>
