<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk Comic Reader</title>

  <style>
    :root {
      --theme-bg: #05060a;
      --theme-accent: #343c66;
    }

    body {
      margin: 0;
      background: var(--theme-bg);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header, footer {
      padding: 12px 16px;
      background: #0b0d16;
      border-bottom: 1px solid var(--theme-accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer {
      border-top: 1px solid var(--theme-accent);
      border-bottom: none;
    }

    #viewer {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
      background: #000;
      padding: 10px 0;
    }

    #flipWrapper {
      position: relative;
      display: inline-block;
      perspective: 2000px;
    }

    .pageCanvas {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      transition: transform 0.6s ease, box-shadow 0.6s ease;
      transform-origin: left center;
      backface-visibility: hidden;
    }

    .flip {
      transform: translateX(-50%) rotateY(-180deg);
      box-shadow: -20px 0 40px rgba(0,0,0,0.6);
    }

    button {
      padding: 8px 16px;
      background: #1b2140;
      color: #e5e7ff;
      border: 1px solid var(--theme-accent);
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    button:hover {
      background: var(--theme-accent);
    }

    .page-info {
      font-size: 12px;
      color: var(--theme-accent);
      text-transform: uppercase;
    }

    /* MUSIC SECTION */
    #musicSection {
      padding: 15px;
      background: #05060f;
      border-top: 1px solid #222;
    }

    #musicSearch {
      width: 100%;
      max-width: 360px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #343c66;
      background: #02030a;
      color: #e5e7ff;
      font-size: 12px;
      outline: none;
    }

    #musicResults {
      margin-top: 8px;
      max-height: 140px;
      overflow-y: auto;
      font-size: 12px;
    }

    .music-row {
      padding: 4px 0;
      cursor: pointer;
      color: #cfd3ff;
    }

    .music-row:hover {
      color: #ffffff;
    }

    #musicPlayer {
      margin-top: 10px;
      width: 100%;
      max-width: 360px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <div>Boardwalk Comic Reader</div>
  <div id="status">Loading…</div>
</header>

<div id="viewer">
  <div id="flipWrapper">
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>
  </div>
</div>

<!-- MUSIC SECTION -->
<div id="musicSection">
  <input id="musicSearch" placeholder="Search music…">
  <div id="musicResults"></div>

  <audio id="musicPlayer" controls>
    <source id="musicSource" src="" type="audio/mpeg">
  </audio>
</div>

<footer>
  <button id="prevBtn">Prev</button>
  <div class="page-info" id="pageInfo">Page 0 / 0</div>
  <button id="nextBtn">Next</button>
</footer>

<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs";

  const comicThemes = {
    "gold-lake-1": "#2a4dff",
    "gold-lake-2": "#2a4dff",
    "new-civil-war-1": "#ff2a2a",
    "new-civil-war-2": "#ff2a2a",
    "new-civil-war-3": "#ff2a2a"
  };

  let fileName = new URLSearchParams(window.location.search).get("id");
  if (!fileName) throw new Error("Missing ?id=");

  if (!fileName.toLowerCase().endsWith(".pdf")) fileName += ".pdf";

  const baseName = fileName.replace(".pdf", "");
  const themeColor = comicThemes[baseName] || "#343c66";

  document.documentElement.style.setProperty("--theme-accent", themeColor);

  const PDF_URL = `https://boardwalkclay1.github.io/comic/assets/books/${fileName}`;

  const pageA = document.getElementById("pageA");
  const pageB = document.getElementById("pageB");
  const ctxA = pageA.getContext("2d");
  const ctxB = pageB.getContext("2d");

  const status = document.getElementById("status");
  const pageInfo = document.getElementById("pageInfo");

  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let isRendering = false;
  let showingA = true;

  function setStatus(msg) {
    status.textContent = msg;
  }

  async function renderPageToCanvas(pageNum, canvas, ctx) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1.5 });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;
  }

  async function flipToPage(num) {
    if (isRendering) return;
    isRendering = true;

    const front = showingA ? pageA : pageB;
    const back = showingA ? pageB : pageA;
    const backCtx = showingA ? ctxB : ctxA;

    await renderPageToCanvas(num, back, backCtx);

    front.style.transform = "translateX(-50%) rotateY(0deg)";
    back.style.transform = "translateX(-50%) rotateY(180deg)";

    requestAnimationFrame(() => back.classList.add("flip"));

    setTimeout(() => {
      back.classList.remove("flip");
      showingA = !showingA;
      currentPage = num;
      pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
      isRendering = false;
    }, 600);
  }

  async function loadPdf() {
    setStatus(`Loading ${fileName}…`);
    const loadingTask = pdfjsLib.getDocument(PDF_URL);
    pdfDoc = await loadingTask.promise;

    totalPages = pdfDoc.numPages;

    await renderPageToCanvas(1, pageA, ctxA);
    pageInfo.textContent = `Page 1 / ${totalPages}`;
    setStatus("Ready");
  }

  document.getElementById("prevBtn").onclick = () => {
    if (currentPage > 1) flipToPage(currentPage - 1);
  };

  document.getElementById("nextBtn").onclick = () => {
    if (currentPage < totalPages) flipToPage(currentPage + 1);
  };

  loadPdf();

  /* MUSIC SYSTEM */
  const tracks = [
    {
      title: "Lofi Study",
      tags: "lofi chill study calm",
      url: "https://cdn.pixabay.com/download/audio/2022/10/03/audio_4f1b1b7f3e.mp3?filename=lofi-study-122191.mp3"
    },
    {
      title: "Chill Ambient",
      tags: "ambient chill background space",
      url: "https://cdn.pixabay.com/download/audio/2021/09/30/audio_3b2e1c7d2a.mp3?filename=ambient-chill-98765.mp3"
    },
    {
      title: "Dark Synthwave",
      tags: "dark synthwave cyberpunk night",
      url: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_9a8c7d6e5f.mp3?filename=dark-synthwave-112233.mp3"
    },
    {
      title: "Epic Trailer",
      tags: "epic action trailer cinematic",
      url: "https://cdn.pixabay.com/download/audio/2021/11/15/audio_1c2b3a4d5e.mp3?filename=epic-trailer-556677.mp3"
    },
    {
      title: "Soft Piano",
      tags: "piano soft emotional sad calm",
      url: "https://cdn.pixabay.com/download/audio/2022/01/20/audio_7e6d5c4b3a.mp3?filename=soft-piano-778899.mp3"
    }
  ];

  const musicSearch = document.getElementById("musicSearch");
  const musicResults = document.getElementById("musicResults");
  const musicPlayer = document.getElementById("musicPlayer");
  const musicSource = document.getElementById("musicSource");

  function renderTracks(filter = "") {
    const q = filter.toLowerCase().trim();
    musicResults.innerHTML = "";

    const filtered = tracks.filter(t =>
      !q || t.title.toLowerCase().includes(q) || t.tags.toLowerCase().includes(q)
    );

    if (filtered.length === 0) {
      musicResults.innerHTML =
        '<div style="color:#6b72a8; padding:4px 0;">No tracks found.</div>';
      return;
    }

    filtered.forEach(track => {
      const row = document.createElement("div");
      row.className = "music-row";
      row.textContent = track.title;
      row.onclick = () => playTrack(track.url);
      musicResults.appendChild(row);
    });
  }

  function playTrack(url) {
    musicSource.src = url;
    musicPlayer.load();
    musicPlayer.play();
  }

  musicSearch.addEventListener("input", () => {
    renderTracks(musicSearch.value);
  });

  renderTracks();
</script>

</body>
</html>
