<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boardwalk Comic Reader</title>
  <link rel="stylesheet" href="reader.css">
</head>

<body>

<!-- FULLSCREEN COMIC VIEWER -->
<div id="viewer">
  <div id="flipWrapper">

    <!-- BASE PAGES -->
    <canvas id="pageA" class="pageCanvas"></canvas>
    <canvas id="pageB" class="pageCanvas"></canvas>

    <!-- 3 PEEL LAYERS FOR DRAMATIC TURN -->
    <canvas id="turn1" class="turnLayer"></canvas>
    <canvas id="turn2" class="turnLayer"></canvas>
    <canvas id="turn3" class="turnLayer"></canvas>

  </div>
</div>

<!-- NAV BUTTONS (FLOATING) -->
<div id="navButtons">
  <div class="navBtn" id="prevBtn">Prev</div>
  <div class="navBtn" id="nextBtn">Next</div>
</div>

<!-- SOUNDTRACK SECTION (BELOW, SCROLL TO REACH) -->
<div id="musicSection">
  <iframe 
    id="scPlayer"
    width="100%" 
    height="300" 
    scrolling="no" 
    frameborder="no" 
    allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2187301982&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
  </iframe>
</div>

<!-- PDF.js (official build) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- READER LOGIC -->
<script src="reader.js"></script>

</body>
</html>
