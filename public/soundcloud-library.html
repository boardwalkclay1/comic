<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SoundCloud Library – Boardwalk Universe</title>

  <style>
    body {
      margin: 0;
      background: #05060a;
      color: #e5e7ff;
      font-family: Arial, sans-serif;
    }

    #container {
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #7aa2ff;
    }

    .track {
      padding: 12px 0;
      border-bottom: 1px solid #1b2140;
      cursor: pointer;
      color: #cfd3ff;
    }

    .track:hover {
      color: #fff;
    }

    #scPlayer {
      width: 100%;
      height: 166px;
      border-radius: 8px;
      margin-top: 20px;
      border: none;
    }
  </style>
</head>

<body>

<div id="container">
  <h1>Your SoundCloud Library</h1>

  <div id="trackList"></div>

  <iframe 
    id="scPlayer"
    scrolling="no"
    frameborder="no"
    allow="autoplay">
  </iframe>
</div>

<script>
  const trackList = document.getElementById("trackList");
  const scPlayer = document.getElementById("scPlayer");

  function loadLibrary() {
    const saved = JSON.parse(localStorage.getItem("scSaved") || "[]");

    if (saved.length === 0) {
      trackList.innerHTML = `<div>No saved tracks yet.</div>`;
      return;
    }

    trackList.innerHTML = "";

    saved.forEach(url => {
      const div = document.createElement("div");
      div.className = "track";
      div.textContent = url;
      div.onclick = () => loadTrack(url);
      trackList.appendChild(div);
    });
  }

  async function loadTrack(trackUrl) {
    const oembedUrl =
      `https://soundcloud.com/oembed?format=json&url=${encodeURIComponent(trackUrl)}`;

    const data = await fetch(oembedUrl).then(r => r.json());

    const iframeMatch = data.html.match(/src="([^"]+)"/);
    if (!iframeMatch) return;

    scPlayer.src = iframeMatch[1] + "&auto_play=true";
  }

  loadLibrary();
</script>

</body>
</html>
