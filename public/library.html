<!DOCTYPE html>
<html lang="en" data-theme="hero">
<head>
  <meta charset="UTF-8" />
  <title>Boardwalk Comic Universe – Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Library-specific CSS -->
  <link rel="stylesheet" href="/assets/library.css" />

  <script defer src="/assets/theme.js"></script>
</head>

<body>
  <div id="theme-root" class="app">

    <!-- HEADER -->
    <header class="top-bar">
      <a href="index.html" class="logo-small">BOARDWALK COMIC UNIVERSE</a>
      <nav class="nav-links">
        <a href="library.html" class="active">Library</a>
        <a href="audio.html">Audio</a>
      </nav>
      <button id="themeToggle" class="theme-toggle">Hero / Villain</button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="page page--library">
      <h1 class="page-title">Library</h1>
      <p class="page-subtitle">Select a title to open the full comic or book.</p>

      <section class="comic-grid">

        <!-- New Civil War -->
        <a class="comic-card" href="/reader.html?id=new-civil-war">
          <div class="comic-card__cover">
            <img src="/assets/cw-cover.jpg" alt="New Civil War Cover" />
          </div>
          <div class="comic-card__meta">
            <h3>New Civil War</h3>
            <p>Complete Comic</p>
          </div>
        </a>

        <!-- Gold Lake -->
        <a class="comic-card" href="/reader.html?id=gold-lake">
          <div class="comic-card__cover">
            <img src="/assets/gl-cover.jpg" alt="Gold Lake Cover" />
          </div>
          <div class="comic-card__meta">
            <h3>Gold Lake</h3>
            <p>Complete Comic</p>
          </div>
        </a>

        <!-- Chapter Books -->
        <a class="comic-card" href="/chapter-books.html">
          <div class="comic-card__cover">
            <img src="/assets/chapter-books-cover.jpg" alt="Chapter Books Cover" />
          </div>
          <div class="comic-card__meta">
            <h3>Chapter Books</h3>
            <p>Stories & Lore</p>
          </div>
        </a>

      </section>
    </main>

  </div>
</body>
</html>
