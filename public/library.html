<!DOCTYPE html>
<html lang="en" data-theme="hero">
<head>
  <meta charset="UTF-8" />
  <title>Boardwalk Comic Universe – Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <script defer src="assets/theme.js"></script>
</head>

<body>
  <div id="theme-root" class="app">

    <!-- HEADER -->
    <header class="top-bar">
      <a href="index.html" class="logo-small">BOARDWALK COMIC UNIVERSE</a>
      <nav class="nav-links">
        <a href="library.html" class="active">Library</a>
        <a href="audio.html">Audio</a>
      </nav>
      <button id="themeToggle" class="theme-toggle">Hero / Villain</button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="page page--library">
      <h1 class="page-title">Library</h1>
      <p class="page-subtitle">Select a title to open the full comic or book.</p>

      <section id="bookGrid" class="comic-grid">

        <!-- New Civil War -->
        <a class="comic-card" href="/assets/new-civil-war-1.pdf" target="_blank">
          <div class="comic-card__cover">
            <embed src="/assets/new-civil-war-1.pdf#page=1&view=FitH" type="application/pdf" />
          </div>
          <div class="comic-card__meta">
            <h3>New Civil War</h3>
            <p>Complete Comic</p>
          </div>
        </a>

        <!-- Gold Lake -->
        <a class="comic-card" href="/assets/gold-lake-1.pdf" target="_blank">
          <div class="comic-card__cover">
            <embed src="/assets/gold-lake-1.pdf#page=1&view=FitH" type="application/pdf" />
          </div>
          <div class="comic-card__meta">
            <h3>Gold Lake</h3>
            <p>Complete Comic</p>
          </div>
        </a>

      </section>
    </main>

  </div>
</body>
</html>
