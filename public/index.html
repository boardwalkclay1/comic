<!DOCTYPE html>
<html lang="en" data-theme="hero">
<head>
  <meta charset="UTF-8" />
  <title>Cosmic Comic Universe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/assets/css/styles.css" />
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/index.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #05060a; color: #fff; }

    .intro-root { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .intro-bg { position: absolute; inset: 0; background: radial-gradient(circle at center, #1b2140 0%, #05060a 60%, #000 100%); z-index: 0; }

    .comic-galaxy { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .comic-galaxy-page {
      position: absolute;
      width: 420px; height: 600px;
      background-size: cover; background-position: center;
      opacity: 0;
      filter: brightness(0.8) contrast(1.2);
      border-radius: 8px;
      mix-blend-mode: screen;
      animation: galaxyFloat 18s ease-in-out infinite;
    }

    @keyframes galaxyFloat {
      0% { opacity: 0; transform: translateY(40vh) translateX(-20vw) rotate(-12deg) scale(1.1); }
      25% { opacity: 0.6; }
      50% { opacity: 0.9; transform: translateY(-10vh) translateX(10vw) rotate(6deg) scale(1.15); }
      75% { opacity: 0.5; }
      100% { opacity: 0; transform: translateY(-40vh) translateX(25vw) rotate(18deg) scale(1.05); }
    }

    .page-stack { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; perspective: 2600px; z-index: 1; }
    .page {
      position: absolute; width: 100vw; height: 100vh;
      background-size: cover; background-position: center;
      opacity: 0;
      transform-origin: left center;
      transform: translateX(-20%) rotateY(50deg) scale(1.1);
      filter: brightness(0.6) contrast(1.1);
      mix-blend-mode: lighten;
    }

    .page--active { animation: pageFlip 0.7s ease-out forwards; }
    .page--burn { animation: pageBurn 0.9s ease-out forwards; }

    @keyframes pageFlip {
      0% { opacity: 0; transform: translateX(-30%) rotateY(70deg) scale(1.15); filter: brightness(0.3); }
      40% { opacity: 1; transform: translateX(0%) rotateY(0deg) scale(1); filter: brightness(1); }
      100% { opacity: 1; transform: translateX(3%) rotateY(-8deg) scale(1.02); filter: brightness(1.15); }
    }

    @keyframes pageBurn {
      0% { opacity: 1; filter: brightness(1.2) contrast(1.1) drop-shadow(0 0 40px rgba(255,140,0,0.7)); }
      40% { filter: brightness(1.4) contrast(1.3) drop-shadow(0 0 60px rgba(255,80,0,1)); }
      80% { filter: brightness(0.8) contrast(1.6) drop-shadow(0 0 80px rgba(255,40,0,1)); }
      100% { opacity: 0; filter: brightness(0.2) contrast(2) drop-shadow(0 0 100px rgba(0,0,0,1)); }
    }

    .intro-title-wrap {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 3; pointer-events: none; text-align: center;
    }

    .intro-kicker, .intro-title, .intro-sub, .intro-cta { opacity: 0; transform: translateY(20px); animation: fadeUp 1.2s ease-out forwards; }
    .intro-kicker { animation-delay: 0.4s; }
    .intro-title { animation-delay: 0.8s; font-size: 3rem; }
    .intro-sub { animation-delay: 1.2s; max-width: 480px; }
    .intro-cta { animation-delay: 1.6s; display: flex; gap: 1rem; pointer-events: auto; }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .intro-btn {
      padding: 0.9rem 2rem; border-radius: 999px;
      border: 1px solid #9aa4ff; background: rgba(5,6,20,0.9);
      color: #e5e7ff; font-weight: 700; text-transform: uppercase;
      cursor: pointer; text-decoration: none;
    }

    .intro-noise {
      position: absolute; inset: -40px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='noStitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light; opacity: 0.7; pointer-events: none; z-index: 4;
    }
  </style>
</head>

<body>
  <div class="intro-root">
    <div class="intro-bg"></div>

    <div class="comic-galaxy" id="comicGalaxy"></div>

    <div class="page-stack" id="pageStack">
      <div class="page" style="background-image:url('/assets/page-1.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-2.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-3.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-4.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-5.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-6.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-7.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-8.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-9.jpg')"></div>
      <div class="page" style="background-image:url('/assets/page-10.jpg')"></div>
      <div class="page" style="background-image:url('/assets/img/comic-logo.jpg')"></div>
    </div>

    <div class="intro-title-wrap">
      <div class="intro-kicker">WELCOME TO</div>
      <div class="intro-title">COSMIC COMIC UNIVERSE</div>
      <div class="intro-sub">A cinematic gateway into your world — where every frame hits like a panel.</div>

      <div class="intro-cta">
        <a href="library.html" class="intro-btn">Enter Library</a>
        <a href="audio.html" class="intro-btn">Audio Universe</a>
        <a href="short-films.html" class="intro-btn">Short Films</a>
        <a href="/builder/builder.html" class="intro-btn">Cosmic Comic Builder</a>
      </div>
    </div>

    <div class="intro-noise"></div>
  </div>
</body>
</html>
